<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reserve a table at Oak & Ember. This form is checked in the browser only.">
  <title>Reserve | Oak & Ember</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" href="../assets/images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">Oak &amp; Ember</a>
      <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <nav id="site-nav" aria-label="Main">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="visit.html">Visit</a></li>
          <li><a href="reserve.html" aria-current="page">Reserve</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container page">
    <h1>Reserve</h1>
    <p class="lead">Weekend brunch tables go quickly. This form is validated in the browser only. It does not send email.</p>

    <form id="reserve-form" class="reserve-form" action="#" method="post">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="date">Date</label>
      <input id="date" name="date" type="date" required>

      <label for="time">Time</label>
      <select id="time" name="time" required>
        <option value="">Select a time</option>
        <option value="08:00">8:00am</option>
        <option value="09:00">9:00am</option>
        <option value="10:30">10:30am</option>
        <option value="12:00">12:00pm</option>
      </select>

      <label for="guests">Guests</label>
      <select id="guests" name="guests" required>
        <option value="">Select</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>

      <button type="submit">Request table</button>
      <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Oak &amp; Ember. All rights reserved.</p>
    </div>
  </footer>
  <script src="../assets/js/script.js"></script>
</body>
</html>
